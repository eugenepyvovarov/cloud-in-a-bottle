---
# Dev tools and dotfiles for the host user. Dispatches package install to
# the right per-distro file; the dotfiles copy is distro-agnostic and lives
# here.

- name: Install dev packages (Debian/Ubuntu)
  include_tasks: dev_packages_debian.yml
  when: ansible_facts.os_family == 'Debian'

- name: Install dev packages (Arch)
  include_tasks: dev_packages_arch.yml
  when: ansible_facts.os_family == 'Archlinux'

- name: Copy dotfiles
  copy:
    src: "{{ playbook_dir }}/dotfiles/"
    dest: /home/host/
    owner: host
    group: host
